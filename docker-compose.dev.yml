version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app:cached
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:12345@db:5432/postgres
      FLIGHT_API_PASSWORD: LrW1Y0J)Kv6h
      FLIGHT_API_USERNAME: api
      NEXT_PUBLIC_APP_URL: http://localhost:3000 # Change this
      OFFICE_ID: CRS001328
      ZIBAL_MERCHANT_ID: zibal
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    # ports:
    # - "3001:3000"  # Map host 3001 to container 3000
    depends_on:
      db:
        condition: service_healthy
    user: root
    command: sleep infinity

  db:
    # ... keep your existing db config
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "12345"
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 30s
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    # ... keep your existing pgadmin config
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_DEFAULT_EMAIL: admin@safartoday.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    image: dpage/pgadmin4:latest
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgadmin_data:
  postgres_data:
